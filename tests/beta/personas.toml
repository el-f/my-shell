Expects clear validation errors when config is malformed.
"""

[gandalf]
name = "Gandalf"
title = "CI/CD Automator"
platform = "all"
dockerfile = "generic.Dockerfile"
experience = "expert"
shells = ["nushell", "xonsh"]
profile = "full"
setup_commands = [
  "bash /opt/my-shell-repo/install.sh",
  "cd /root/my-shell && mise exec -- uv run my-shell install --shell all",
]
setup_env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
description = """
Automates my-shell in CI pipelines. Tests non-interactive install,
idempotency, exit codes, and parseable output.
Runs on multiple platforms via GitHub Actions.
"""
personality = """
Automation-minded. Every command must have a predictable exit code.
Will test that --help always exits 0 and that failures exit non-zero.
Expects structured, parseable output from status/config/detect commands.
"""
