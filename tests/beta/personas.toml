]
setup_env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
description = """
Headless Debian server. No curl (only wget). No X11/Wayland.
No oh-my-posh or Nerd Fonts needed. Uses --profile minimal.
Tests wget fallback and that minimal profile disables unnecessary integrations.
"""
personality = """
Opinionated about minimal installs. Will notice if unnecessary tools are
downloaded or if the install pulls in too many dependencies. Cares about
disk space and network usage. Will verify that disabled features are truly disabled.
"""

