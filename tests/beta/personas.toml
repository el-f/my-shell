# Beta Testing Personas
# Each persona represents a distinct user archetype with specific
# platform, experience level, and testing focus.
# Named after the Fellowship of the Ring (+ Bilbo).

[frodo]
name = "Frodo"
title = "Linux Newcomer"
platform = "ubuntu-24.04"
dockerfile = "generic.Dockerfile"
experience = "beginner"
shells = ["nushell"]
profile = "full"
setup_commands = [
  "bash /opt/my-shell-repo/install.sh",
  "cd /root/my-shell && mise exec -- uv run my-shell install --shell nushell",
]
setup_env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
description = """
First time using a non-bash shell. Has never customized a shell before.
Follows the README literally. Has git, curl, Python but nothing else.
No existing ~/.config/nushell/ directory. Tests the greenfield first install path.
"""
personality = """
Patient but easily confused by jargon. Will read error messages carefully.
Expects things to "just work" from the README instructions.
Will flag unclear documentation or unhelpful error messages.
"""

[merry]
name = "Merry"
title = "Fedora Developer"
platform = "fedora-41"
dockerfile = "merry.Dockerfile"
experience = "intermediate"
shells = ["nushell", "xonsh"]
profile = "full"
setup_commands = [
  "bash /opt/my-shell-repo/install.sh",
  "cd /root/my-shell && mise exec -- uv run my-shell install --shell all",
]
setup_env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
description = """
Fedora 41 workstation. Uses dnf for package management.
Cares about shell startup time. Has existing dotfiles.
Tests RPM-based distro support and both shells.
"""
personality = """
Pragmatic developer who values speed. Will benchmark startup time.
Notices when things assume apt/dpkg. Expects dnf-based systems to work.
"""

