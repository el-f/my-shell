# Legolas -- ARM Tinkerer
# Raspberry Pi 5, ARM64 Debian, limited resources

[[stories]]
id = "legolas-01"
title = "Install on aarch64 Debian"
description = "Run install.sh on ARM64 Debian (Raspberry Pi OS)"
commands = ["bash /opt/my-shell-repo/install.sh"]
env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
expected_outcomes = [
  "Exit code 0",
  "uv and mise install ARM64 binaries",
  "No x86_64 assumptions",
]
judge_criteria = [
  "Does the install script handle ARM64 correctly?",
  "Are ARM64 binaries downloaded (not x86)?",
]
category = "install"

[[stories]]
id = "legolas-02"
title = "Install nushell on ARM64"
description = "Install nushell binary for aarch64"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell install --shell nushell",
]
expected_outcomes = [
  "nushell installed for aarch64",
  "Correct binary architecture",
]
judge_criteria = [
  "Does it download the ARM64 nushell binary?",
  "Is the binary functional on ARM?",
]
category = "install"

