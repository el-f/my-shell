[[stories]]
id = "legolas-11"
title = "Modern replacement aliases defined"
description = "Verify modern replacement aliases are defined even if underlying tools aren't installed"
commands = [
  "nu --config ~/.config/nushell/config.nu --env-config ~/.config/nushell/env.nu -c 'help aliases | where name in [ls ll la lt grep cat ps du df sed] | length'",
]
expected_outcomes = [
  "Returns 10 (all modern replacement aliases defined)",
  "Aliases are defined regardless of whether underlying tools (eza, rg, etc.) are installed",
]
judge_criteria = [
  "Are all modern replacement aliases present?",
  "Do they exist even when the real tool is missing?",
]
category = "integration"
