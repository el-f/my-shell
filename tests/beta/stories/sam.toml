[[stories]]
id = "sam-10"
title = "Plugin status before compilation"
description = "Check plugins status when cargo is available but plugins haven't been built yet"
commands = ["cd /root/my-shell && mise exec -- uv run my-shell plugins status"]
expected_outcomes = [
  "Shows plugin status for each plugin",
  "Plugins listed as not compiled/not registered",
]
judge_criteria = [
  "Does status clearly distinguish compiled vs not-compiled plugins?",
  "Is it clear which plugins are available for installation?",
]
category = "plugins"

[[stories]]
id = "sam-11"
title = "Deploy and verify xonsh aliases"
description = "Setup xonsh and verify Docker/kubectl aliases are available"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell install --shell xonsh",
  "cd /root/my-shell && mise exec -- uv run my-shell setup --shell xonsh",
  "xonsh --rc ~/.xonshrc -c 'print(\"d\" in aliases and \"k\" in aliases)'",
]
expected_outcomes = [
  "xonsh installed and config deployed successfully",
  "Docker alias 'd' and kubectl alias 'k' are present (prints True)",
  "No xontrib loading errors in stderr",
]
judge_criteria = [
  "Do the same aliases work across both shells?",
  "Are there any xonsh-specific warnings during deploy?",
]
category = "integration"

[[stories]]
id = "sam-12"
title = "Verify xontrib loading in xonsh"
description = "Start xonsh and verify xontribs load without errors"
commands = ["xonsh --rc ~/.xonshrc -c 'print(\"xontribs loaded ok\")' 2>&1"]
expected_outcomes = [
  "Output contains 'xontribs loaded ok'",
  "No xontrib import errors or warnings in combined stdout/stderr",
]
judge_criteria = [
  "Do all configured xontribs load cleanly?",
  "Are there any deprecation warnings or import errors?",
]
category = "integration"
