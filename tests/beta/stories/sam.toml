# Sam -- DevOps Engineer
# Arch Linux, full dev tools, Docker/k8s aliases, cargo plugins

[[stories]]
id = "sam-01"
title = "Install on Arch Linux"
description = "Run install.sh on Arch Linux with pacman"
commands = ["bash /opt/my-shell-repo/install.sh"]
env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
expected_outcomes = [
  "Exit code 0",
  "Install completes on Arch",
  "No Debian/Ubuntu-specific assumptions",
]
judge_criteria = [
  "Does install.sh work on a non-Debian distro?",
  "Are there any apt-get assumptions?",
]
category = "install"

[[stories]]
id = "sam-02"
title = "Setup with full profile"
description = "Deploy with full profile to get all integrations"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell setup --profile full",
]
expected_outcomes = ["Full profile applied", "All integrations enabled"]
judge_criteria = [
  "Are all integrations clearly listed?",
  "Is it clear what full profile includes vs minimal?",
]
category = "deploy"

[[stories]]
id = "sam-03"
title = "Docker aliases work"
description = "Verify Docker-related aliases are available and correct"
commands = [
  "nu --config ~/.config/nushell/config.nu --env-config ~/.config/nushell/env.nu -c 'help aliases | where name in [d dc dps di] | length'",
  "nu --config ~/.config/nushell/config.nu --env-config ~/.config/nushell/env.nu -c 'help aliases | where name == d | get 0.expansion'",
]
expected_outcomes = [
  "Docker aliases are defined",
  "Aliases map to expected docker commands",
]
judge_criteria = [
  "Are the Docker alias names intuitive?",
  "Do they cover common Docker workflows?",
]
category = "integration"

[[stories]]
id = "sam-04"
title = "Kubectl aliases work"
description = "Verify Kubernetes-related aliases are available"
commands = [
  "nu --config ~/.config/nushell/config.nu --env-config ~/.config/nushell/env.nu -c 'help aliases | where name in [k kg kd kdel] | length'",
  "nu --config ~/.config/nushell/config.nu --env-config ~/.config/nushell/env.nu -c 'help aliases | where name == k | get 0.expansion'",
]
expected_outcomes = [
  "Kubectl aliases are defined",
  "Aliases map to expected kubectl commands",
]
judge_criteria = [
  "Are the kubectl alias names standard?",
  "Do they follow kubectl alias conventions?",
]
category = "integration"

[[stories]]
id = "sam-05"
title = "Plugin setup via cargo"
description = "Compile and register nushell plugins"
commands = ["cd /root/my-shell && mise exec -- uv run my-shell plugins setup"]
expected_outcomes = [
  "Output shows cargo build progress or success message per plugin",
  "Plugins registered with nushell",
]
judge_criteria = [
  "Is the compilation progress visible?",
  "Are failures clearly attributed to specific plugins?",
]
category = "plugins"

[[stories]]
id = "sam-06"
title = "Atuin integration"
description = "Verify atuin shell history integration is configured"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell doctor",
  "test -f ~/.config/nushell/atuin.nu && echo 'atuin init exists' || echo 'no atuin init'",
  "grep -l 'atuin' ~/.config/nushell/config.nu 2>/dev/null && echo 'atuin sourced' || echo 'atuin not sourced'",
]
expected_outcomes = [
  "Doctor shows atuin status",
  "Atuin init file generated if atuin is installed",
  "Config.nu sources atuin integration",
]
judge_criteria = [
  "Is atuin integration optional and clearly documented?",
  "What happens when atuin is not installed?",
]
category = "integration"

