[[stories]]
id = "gandalf-10"
title = "Full pipeline: setup, doctor, benchmark"
description = "Run a complete pipeline of commands as CI would"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell setup --shell all",
  "cd /root/my-shell && mise exec -- uv run my-shell doctor",
  "cd /root/my-shell && mise exec -- uv run my-shell benchmark",
  "nu -c 'print \"nushell: ok\"'",
  "xonsh --rc ~/.xonshrc -c 'print(\"xonsh: ok\")' 2>&1",
]
expected_outcomes = [
  "All commands exit 0",
  "Pipeline completes end-to-end",
  "Both deployed shells start non-interactively and print their ok line",
  "Output is CI-friendly",
]
judge_criteria = [
  "Does the full pipeline work without manual intervention?",
  "Do both shells load their deployed config without warnings?",
  "Is every step's output useful in a CI log?",
]
category = "pipeline"

[[stories]]
id = "gandalf-11"
title = "Config output is valid JSON"
description = "Parse config output with python json.loads to verify it's standard JSON"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell config | python3 -c 'import sys,json; d=json.load(sys.stdin); print(\"valid JSON, keys:\", list(d.keys()))'",
]
expected_outcomes = ["Output is valid JSON", "python json.load succeeds"]
judge_criteria = ["Is the config output standard JSON that scripts can parse?"]
category = "cli"

[[stories]]
id = "gandalf-12"
title = "Non-zero exit codes for failures"
description = "Verify that invalid inputs produce non-zero exit codes for CI gating"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell setup --shell fish 2>&1",
  "cd /root/my-shell && mise exec -- uv run my-shell rollback --shell nushell --to nonexistent 2>&1",
]
expected_outcomes = [
  "Invalid shell 'fish' produces non-zero exit code",
  "Invalid rollback target produces non-zero exit code",
  "Error messages are written to stderr with actionable text",
]
judge_criteria = [
  "Are exit codes reliable for CI scripting?",
  "Do error messages contain enough context to debug?",
]
category = "error-handling"
