# Frodo -- Linux Newcomer
# Greenfield first install on Ubuntu 24.04, follows README literally

[[stories]]
id = "frodo-01"
title = "Fresh install via install.sh"
description = "Run the install script on a fresh system with nothing pre-installed except git/curl"
commands = ["bash /opt/my-shell-repo/install.sh"]
env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
expected_outcomes = [
  "Exit code 0",
  "uv gets installed",
  "mise gets installed",
  "Repository cloned to install dir",
  "mise install completes",
  "mise setup completes",
  "Output contains a summary/success line indicating what was installed",
]
judge_criteria = [
  "Was the output clear and easy to follow for a beginner?",
  "Were there any confusing warnings or errors?",
  "Did the banner/progress look professional?",
]
category = "install"

[[stories]]
id = "frodo-02"
title = "CLI help output"
description = "Run my-shell --help and verify all subcommands are listed"
commands = ["cd /root/my-shell && mise exec -- uv run my-shell --help"]
expected_outcomes = [
  "Exit code 0",
  "Lists subcommands: install, setup, render, deploy, install-tools, install-fonts, detect, plugins, status, update, doctor, benchmark, rollback, init, version, validate, config, uninstall",
  "Output is readable and organized",
]
judge_criteria = [
  "Are the subcommand descriptions clear for a newcomer?",
  "Is there a logical grouping of commands?",
]
category = "cli"

