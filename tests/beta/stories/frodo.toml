]
expected_outcomes = [
  "Exit code 0",
  "Config files deployed to nushell config dir",
  "Aliases rendered",
]
judge_criteria = [
  "Was the output clear about what was deployed and where?",
  "Were there any scary warnings?",
]
category = "deploy"

[[stories]]
id = "frodo-05"
title = "Launch nushell and verify aliases"
description = "Start nu with the deployed config and try some aliases"
commands = [
  "nu --config ~/.config/nushell/config.nu --env-config ~/.config/nushell/env.nu -c 'help aliases | where name == g | length'",
  "nu --config ~/.config/nushell/config.nu --env-config ~/.config/nushell/env.nu -c 'help aliases | where name == gs | length'",
  "nu --config ~/.config/nushell/config.nu --env-config ~/.config/nushell/env.nu -c 'help aliases | where name == ll | length'",
]
expected_outcomes = [
  "Each query returns 1 (exactly one alias found per name)",
  "No errors on shell startup",
]
judge_criteria = [
  "Did the shell start without errors or warnings?",
  "Are the aliases intuitive for a newcomer?",
]
category = "integration"

