[[stories]]
id = "bilbo-10"
title = "Uninstall xonsh config with no-keep-custom"
description = "Uninstall xonsh config without preserving custom files"
commands = [
  "cd /root/my-shell && echo y | mise exec -- uv run my-shell uninstall --shell xonsh --no-keep-custom",
]
expected_outcomes = [
  "Deployed configs removed",
  "user-custom.xsh also removed",
  "Clear confirmation before destructive action",
]
judge_criteria = [
  "Is there a confirmation prompt for destructive action?",
  "Is it clear that custom files will be lost?",
]
category = "lifecycle"

[[stories]]
id = "bilbo-11"
title = "Commands overview in xonsh"
description = "Run the 'commands' function in xonsh to list available commands and aliases"
commands = ["xonsh --rc ~/.xonshrc -c 'commands'"]
expected_outcomes = [
  "Shows custom commands list (fj, fx, fh, fk, port, clip, trash, sysinfo, etc.)",
  "Shows alias categories",
  "No errors",
]
judge_criteria = [
  "Does the xonsh output match the nushell version?",
  "Is it readable and useful?",
]
category = "integration"

[[stories]]
id = "bilbo-12"
title = "Verify xontrib loading"
description = "Start xonsh and check that xontribs load without errors"
commands = ["xonsh --rc ~/.xonshrc -c 'print(\"xonsh started ok\")' 2>&1"]
expected_outcomes = [
  "Output contains 'xonsh started ok'",
  "No xontrib import errors or warnings in combined output",
]
judge_criteria = ["Do all xontribs load cleanly?", "Any startup warnings?"]
category = "integration"
