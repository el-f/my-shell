# Bilbo -- Data Scientist
# Ubuntu 22.04, xonsh focus, Python integration

[[stories]]
id = "bilbo-01"
title = "Install on Ubuntu 22.04"
description = "Run install.sh on Ubuntu 22.04"
commands = ["bash /opt/my-shell-repo/install.sh"]
env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
expected_outcomes = [
  "Exit code 0",
  "Install completes successfully",
  "uv and mise installed",
]
judge_criteria = [
  "Is the install straightforward?",
  "Are there any issues on Ubuntu 22.04?",
]
category = "install"

[[stories]]
id = "bilbo-02"
title = "Install xonsh"
description = "Install xonsh shell via my-shell"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell install --shell xonsh",
]
expected_outcomes = ["xonsh installed successfully", "Available on PATH"]
judge_criteria = [
  "Is the xonsh install straightforward?",
  "Is the version appropriate?",
]
category = "install"

[[stories]]
id = "bilbo-03"
title = "Setup xonsh"
description = "Deploy xonsh configuration"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell setup --shell xonsh",
]
expected_outcomes = ["xonsh config deployed", "Aliases rendered as .xsh"]
judge_criteria = [
  "Is the xonsh config structure clear?",
  "Are the deployed files explained?",
]
category = "deploy"

[[stories]]
id = "bilbo-04"
title = "xonsh Python integration"
description = "Verify Python interop works in xonsh"
commands = [
  "xonsh -c 'import sys; print(sys.version)'",
  "xonsh -c 'print(2 + 2)'",
]
expected_outcomes = ["Python code executes in xonsh", "No import errors"]
judge_criteria = [
  "Did both xonsh commands print Python output with exit code 0?",
  "Does the deployed config interfere with Python imports?",
]
category = "integration"

[[stories]]
id = "bilbo-05"
title = "xonsh sysinfo alias"
description = "Run sysinfo command in xonsh"
commands = ["xonsh --rc ~/.xonshrc -c 'sysinfo'"]
expected_outcomes = [
  "sysinfo command works in xonsh",
  "Shows system info table with OS, shell version, and installed tools",
]
judge_criteria = [
  "Is the output similar to nushell's sysinfo?",
  "Does it show relevant system details?",
]
category = "integration"

[[stories]]
id = "bilbo-06"
title = "Validate configuration"
description = "Run validate to check config integrity"
commands = ["cd /root/my-shell && mise exec -- uv run my-shell validate"]
expected_outcomes = ["Validation passes", "All TOML files are valid"]
judge_criteria = [
  "Is the validation output clear?",
  "Does it check all relevant files?",
]
category = "cli"

[[stories]]
id = "bilbo-07"
title = "user-custom.xsh preserved across deploys"
description = "Create a user-custom.xsh, redeploy, verify it survives"
commands = [
  "echo 'print(\"custom\")' > ~/.config/xonsh/user-custom.xsh",
  "cd /root/my-shell && mise exec -- uv run my-shell setup --shell xonsh",
  "cat ~/.config/xonsh/user-custom.xsh",
]
expected_outcomes = [
  "user-custom.xsh content preserved after redeploy",
  "Custom content is intact",
]
judge_criteria = [
  "Is it clearly documented that user-custom files are preserved?",
  "Is there a warning if it would be overwritten?",
]
category = "deploy"

[[stories]]
id = "bilbo-08"
title = "Rollback xonsh config"
description = "Roll back to a previous xonsh configuration"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell rollback --shell xonsh",
