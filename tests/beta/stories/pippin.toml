# Pippin -- openSUSE Power User
# openSUSE Tumbleweed, zypper, Nerd Fonts, oh-my-posh, lifecycle

[[stories]]
id = "pippin-01"
title = "Install on openSUSE Tumbleweed"
description = "Run install.sh on openSUSE rolling release"
commands = ["bash /opt/my-shell-repo/install.sh"]
env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
expected_outcomes = [
  "Exit code 0",
  "uv installed (via astral.sh)",
  "mise installed",
  "Repository cloned",
  "Setup completes",
]
judge_criteria = [
  "Does install.sh work on a zypper-based distro?",
  "Are there any apt/yum assumptions that break?",
]
category = "install"

[[stories]]
id = "pippin-02"
title = "Idempotent re-install"
description = "Run install.sh again on existing installation"
commands = ["bash /opt/my-shell-repo/install.sh"]
env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
expected_outcomes = [
  "Exit code 0",
  "Detects existing installation",
  "Updates via git pull",
  "No duplicate installs",
]
judge_criteria = [
  "Is it clear that this is an update, not a fresh install?",
  "Does it handle already-installed tools gracefully?",
]
category = "install"

[[stories]]
id = "pippin-03"
title = "Setup nushell on openSUSE"
description = "Deploy nushell configuration on openSUSE"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell setup --shell nushell",
]
expected_outcomes = [
  "Config deployed to ~/.config/nushell/",
  "Paths handled correctly on openSUSE",
]
judge_criteria = [
  "Does setup work on openSUSE without issues?",
  "Any distro-specific path problems?",
]
category = "deploy"

