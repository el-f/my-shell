[[stories]]
id = "pippin-09"
title = "Status before and after deploy"
description = "Check status shows correct state before and after deployment"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell status",
  "cd /root/my-shell && mise exec -- uv run my-shell setup --shell nushell",
  "cd /root/my-shell && mise exec -- uv run my-shell status",
]
expected_outcomes = [
  "First status shows not deployed or out of date",
  "After deploy, status shows up to date",
]
