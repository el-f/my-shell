# Gimli -- Minimalist Server Admin
# Debian 12 minimal, wget only, no curl, minimal profile

[[stories]]
id = "gimli-01"
title = "Install via wget (no curl)"
description = "Run install.sh on a system with wget but no curl"
commands = ["bash /opt/my-shell-repo/install.sh"]
env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
expected_outcomes = [
  "Exit code 0",
  "wget fallback used for uv and mise",
  "Install completes without curl",
]
judge_criteria = [
  "Did the wget path install without printing a curl error?",
  "Are there any curl-specific assumptions that break?",
]
category = "install"

[[stories]]
id = "gimli-02"
title = "Setup with minimal profile"
description = "Deploy with minimal profile to avoid unnecessary integrations"
commands = [
  "cd /root/my-shell && mise exec -- uv run my-shell setup --profile minimal",
]
expected_outcomes = [
  "Minimal profile applied",
  "No oh-my-posh, no font downloads",
  "Only essential aliases and settings",
]
judge_criteria = [
  "Does minimal profile truly minimize the footprint?",
  "Are disabled features truly disabled in the generated config?",
]
category = "deploy"

[[stories]]
id = "gimli-03"
title = "oh-my-posh NOT loaded in minimal"
description = "Verify oh-my-posh is not loaded in minimal profile"
commands = [
  "test -f ~/.config/nushell/config.nu && grep -c 'oh-my-posh' ~/.config/nushell/config.nu || echo 'file-missing-or-no-match'",
  "test ! -f ~/.config/nushell/oh-my-posh.nu && echo 'no omp init file' || echo 'omp init file exists'",
]
expected_outcomes = [
  "No oh-my-posh references in deployed config files",
  "No oh-my-posh init file generated",
]
judge_criteria = [
  "Is oh-my-posh completely absent from deployed config?",
  "No warnings about missing oh-my-posh?",
]
category = "integration"

[[stories]]
id = "gimli-04"
title = "Font install skipped"
description = "Verify font installation is skipped or warns on headless server"
commands = ["cd /root/my-shell && mise exec -- uv run my-shell install-fonts"]
expected_outcomes = [
  "Prints message about headless/no-display and exits without Python traceback",
  "No crash on missing display",
]
judge_criteria = [
  "Does it detect headless environment?",
  "Is the message clear about why fonts aren't installed?",
]
category = "install"

[[stories]]
id = "gimli-05"
title = "Doctor on minimal server"
description = "Run doctor on a minimal server and verify checks are appropriate"
commands = ["cd /root/my-shell && mise exec -- uv run my-shell doctor"]
expected_outcomes = [
  "Doctor completes",
  "Disabled integrations shown as 'info' status, not 'warn' or 'fail'",
  "Core checks pass",
]
judge_criteria = [
  "Does doctor adjust expectations for minimal servers?",
  "Are missing optional tools reported at appropriate severity?",
]
category = "cli"

[[stories]]
id = "gimli-06"
title = "cat falls back to batcat"
description = "Verify cat alias handles batcat (Debian's bat package name)"
commands = [
  "nu --config ~/.config/nushell/config.nu --env-config ~/.config/nushell/env.nu -c 'help aliases | where name == cat'",
]
expected_outcomes = [
  "cat alias defined",
  "Alias uses wrapper that falls back from bat to batcat automatically",
]
judge_criteria = [
  "Does the alias handle Debian's batcat naming?",
  "What happens when neither bat nor batcat exists?",
]
category = "integration"

[[stories]]
id = "gimli-07"
title = "find falls back to fdfind"
description = "Verify find alias handles fdfind (Debian's fd package name)"
commands = [
