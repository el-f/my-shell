category = "integration"

[[stories]]
id = "gimli-08"
title = "Custom install directory"
description = "Install to a non-default directory"
commands = ["bash /opt/my-shell-repo/install.sh"]
env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/opt/custom-my-shell" }
expected_outcomes = [
  "Installs to /opt/custom-my-shell",
  "All paths reference custom directory",
]
judge_criteria = [
  "Does everything work with a custom install dir?",
  "Are there hardcoded default paths that break?",
]
category = "install"

[[stories]]
id = "gimli-09"
title = "Update existing installation"
description = "Run install.sh again to update"
commands = ["bash /opt/my-shell-repo/install.sh"]
env = { MY_SHELL_REPO = "/opt/my-shell-repo", MY_SHELL_INSTALL_DIR = "/root/my-shell" }
expected_outcomes = [
  "Detects existing install",
  "Updates via git pull",
  "Re-runs setup",
]
judge_criteria = [
  "Is it clear that this is an update?",
  "Is the update process fast?",
]
category = "install"

[[stories]]
id = "gimli-10"
title = "Install without git"
description = "Run install.sh on a system without git (temporarily hidden)"
commands = [
  "mv /usr/bin/git /usr/bin/git.hidden && bash /opt/my-shell-repo/install.sh; rc=$?; mv /usr/bin/git.hidden /usr/bin/git; exit $rc",
]
expected_outcomes = [
  "Fails with clear error message",
  "Non-zero exit code",
  "Tells user to install git",
]
judge_criteria = [
  "Is the error message immediately helpful?",
  "Does it suggest how to install git?",
]
category = "error-handling"

[[stories]]
id = "gimli-11"
title = "Font install skipped on headless (env)"
description = "Verify install-fonts detects headless and skips gracefully"
commands = [
  "unset DISPLAY WAYLAND_DISPLAY && cd /root/my-shell && mise exec -- uv run my-shell install-fonts 2>&1",
]
expected_outcomes = [
  "Graceful skip or completion without crash",
  "No X11/display errors",
]
judge_criteria = ["Does it detect headless environment and skip appropriately?"]
category = "install"

[[stories]]
id = "gimli-12"
title = "Navigation aliases work"
description = "Verify cd-based navigation aliases (.., ..., ....) are defined"
commands = [
  "nu --config ~/.config/nushell/config.nu --env-config ~/.config/nushell/env.nu -c 'help aliases | where name in [.. ... ....] | length'",
]
expected_outcomes = [
  "Returns 3 (all three navigation aliases defined)",
  "No errors",
]
judge_criteria = ["Are navigation aliases present and correctly defined?"]
category = "integration"
