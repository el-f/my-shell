version: 2
updates:
  # Keep GitHub Actions (esp. the SHA-pinned third-party jdx/mise-action) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  # Python deps (uv.lock); CI's `uv lock --check` verifies consistency, not currency.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
